version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: codebase_analysis_pgvector
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: codebase_analysis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codebase_analysis_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/codebase_analysis
      - APP_ENV=production
      - SECRET_KEY=production-super-secret-jwt-key-987654321
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: codebase_analysis_frontend
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

  langfuse-web:
    image: langfuse/langfuse:2
    container_name: codebase_analysis_langfuse
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/codebase_analysis
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=langfuse-super-secret-auth-key-12345
      - SALT=langfuse-salt-54321

volumes:
  postgres_data:
